<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#F4F2EF}
body.story{height:1920px}
.s{position:relative;width:1080px;height:100%;padding:84px 84px 140px;display:flex;flex-direction:column;font-family:'Inter Tight',Helvetica,Arial,sans-serif;color:#111}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top img{width:132px;height:132px}
.m{font-family:'IBM Plex Mono',Menlo,monospace;font-size:28px;letter-spacing:1px;text-transform:uppercase}
.n{color:#9A938B;text-align:right;line-height:1.35}
.bar{position:absolute;left:0;top:0;width:100%;height:14px;background:linear-gradient(90deg,#FF9500 0%,#FF4F00 40%,#AF52DE 75%,#292F71 100%)}
.mid{margin-top:auto}
.pill{display:inline-block;font-family:'IBM Plex Mono',Menlo,monospace;font-size:26px;letter-spacing:1px;text-transform:uppercase;padding:12px 22px;border-radius:999px;color:#fff;margin-bottom:34px}
h1{font-weight:900;font-size:150px;line-height:.92;letter-spacing:-6px}
h2{font-weight:900;font-size:112px;line-height:.95;letter-spacing:-4px}
.dot{color:#FF4F00}
.sub{font-size:42px;line-height:1.3;font-weight:500;letter-spacing:-.5px;margin-top:34px;color:#2A2622;max-width:880px}
.meta{border-top:3px solid #111;margin-top:48px;padding-top:26px;display:flex;justify-content:space-between;gap:30px}
.meta div{font-family:'IBM Plex Mono',Menlo,monospace;font-size:27px;line-height:1.45;text-transform:uppercase;color:#6B6560}
.meta b{display:block;color:#111;font-weight:500}
.lead{background:#FFF3EC;background-image:linear-gradient(140deg,#FFF1E6 0%,#FBEAF4 55%,#EEEBFF 100%)}
.orange{background:#FF4F00;color:#fff}.orange .sub,.orange .m,.orange .n{color:#FFE3D6}.orange .meta{border-color:#fff}.orange .meta div{color:#FFE3D6}.orange .meta b{color:#fff}
.photo{color:#fff;background:#111}
.photo .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.photo .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.82) 78%,rgba(0,0,0,.9) 100%)}
.photo .top,.photo .mid{position:relative}
.photo .sub{color:#F1ECE6}.photo .n,.photo .m{color:#E8E2DA}.photo .meta{border-color:#fff}.photo .meta div{color:#D9D2CA}.photo .meta b{color:#fff}
.photo .dot{color:#FF4F00}
</style></head>
<body>
<div class="s" id="s"></div>
<script>
const MU='#AF52DE',FO='#FF9500',CU='#007AFF',HP='#FF4F00';
const S=[
 {cls:'',pill:null,h:'<h1>Jazz,<br>all&nbsp;week<span class="dot">.</span></h1>',sub:'Big bands, two jazzy tree lightings, holiday swing, and our 1926 party. The best of Los Angeles this week.',meta:[['Tuesday','Nov 10'],['Swipe','for the list']]},
 {cls:'lead',pill:['&#9829; Haps pick',HP],h:'<h2>The Jazz Age Party</h2>',sub:'A historic home turns 100, and we&rsquo;re throwing it a 1926 party. Live jazz trio, Prohibition-era cocktails, candlelight all night.',meta:[['Sat Nov 21','7:30&ndash;11:30 PM'],['Tickets $45','Dress Jazz Age']]},
 {pill:['Live jazz',MU],h:'<h2>Big bands at Vibrato</h2>',sub:'Billy Vera&rsquo;s big band with Tamela D&rsquo;Amico, then Bernie Dresel&rsquo;s BBB, at Herb Alpert&rsquo;s supper club.',meta:[['Tue&ndash;Wed','Nov 10&ndash;11'],['Bel Air','Dinner + show']]},
 {pill:['Free &middot; Live jazz',MU],h:'<h2>Tree lighting at Bacari</h2>',sub:'Holiday cocktails, a live jazz trio, and the tree goes up at 7.',meta:[['Tue Nov 17','5&ndash;11 PM'],['Silver Lake','Free to walk in']]},
 {pill:['Free &middot; Live jazz',MU],h:'<h2>Tree lighting at Union Station</h2>',sub:'A 10-piece jazz band in the historic ticket concourse, after Mariachi Ausente.',meta:[['Thu Nov 19','6&ndash;8 PM'],['Downtown','Free, register']]},
 {pill:['Holiday jazz',MU],h:'<h2>The Hot Sardines: Holiday Stomp</h2>',sub:'Hot jazz, swing, and tap for the holidays. Wear the Jazz Age outfit a second time.',meta:[['Sat Dec 19','7:30 PM'],['Santa Monica','BroadStage']]},
 {pill:['Wine',FO],h:'<h2>Fall tasting at Stanley&rsquo;s</h2>',sub:'Twenty wines, four hours, no ticket needed in advance.',meta:[['Sun Nov 15','1&ndash;5 PM'],['Culver City','$40 at the door']]},
 {pill:['Free &middot; Art',CU],h:'<h2>A free new show at The Broad</h2>',sub:'<i>Has the Myth Been Shattered</i>: six decades of artists using the media as material.',meta:[['Opens Sat Nov 21','Through Apr 4'],['Downtown','Free, reserve']]},
 {pill:['Rally the club',FO],h:'<h2>Notte Italiana at Eataly</h2>',sub:'The club is going together to the after-hours, all-you-can-eat Italian holiday party.',meta:[['Fri Dec 11','9 PM&ndash;Midnight'],['Century City','Tickets limited']]},
 {cls:'orange',pill:null,h:'<h2>One email every Tuesday<span style="color:#111">.</span></h2>',sub:'The best things to do in Los Angeles that week, picked by hand. Dinners, live music, art, and our own parties.',meta:[['Free','haps.club'],['Link','in bio']]},
];
const IM=["cover", "jazzage", "vibrato", "bacari", "union", "sardines", "stanleys", "broad", "eataly", "subscribe"];
const p=new URLSearchParams(location.search),i=+(p.get('n')||1)-1,story=p.get('story');
let d=S[i];
if(story){document.body.className='story';d=Object.assign({},S[1],{meta:[['Sat Nov 21','7:30&ndash;11:30 PM'],['Tap','for tickets']]});}
const photo=p.get('photo'),single=p.get('single');const el=document.getElementById('s');if(d.cls)el.className='s '+d.cls;if(photo)el.className='s photo';
const key=story?'jazzage':IM[i];
const logo=(d.cls==='orange'||photo)?'<img src="../assets/img/haps-logo.svg" style="filter:brightness(0) invert(1)">':'<img src="../assets/img/haps-logo.svg">';
el.innerHTML=(photo?'<div class="bg" style="background-image:url(../social/2026-11-10/src/'+key+'.jpg);'+(key==='union'?'background-size:1080px auto;background-position:center 190px;background-repeat:no-repeat;background-color:#140d08':'')+'"></div><div class="shade"></div>':'')+'<div class="bar"></div><div class="top">'+logo+'<div class="m n">Los Angeles<br>'+(story?'Haps pick':single?'This week':String(i+1).padStart(2,'0')+' / '+S.length)+'</div></div><div class="mid">'+(d.pill?'<span class="pill" style="background:'+d.pill[1]+'">'+d.pill[0]+'</span>':'')+d.h+'<p class="sub">'+d.sub+'</p><div class="meta">'+d.meta.map(m=>'<div><b>'+m[0]+'</b>'+m[1]+'</div>').join('')+'</div></div>';
</script>
</body></html>
