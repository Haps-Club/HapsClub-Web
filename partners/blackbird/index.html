<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Haps Club × Blackbird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap">
<style>
:root{--bg:#F5F4F7;--surface:#FFFFFF;--fg:#16131C;--muted:#6B6475;--line:#E6E2EC;--red:#FF3B30;
--sunset:linear-gradient(135deg,#FF9500 0%,#FF3B30 48%,#AF52DE 100%);
--font:"SF Pro Display",-apple-system,BlinkMacSystemFont,Inter,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0E0C12;--surface:#1A1720;--fg:#F4F1F8;--muted:#A49CB0;--line:#2C2734;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--surface);border-radius:26px;overflow:hidden}
.top{background:var(--sunset);color:#fff;padding:32px 28px}
.top small{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.top h1{margin:8px 0 0;font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.05}
form{padding:24px 28px 28px;display:flex;flex-direction:column;gap:12px}
label{font-size:13px;font-weight:600;color:var(--muted)}
input{font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid #FF9500;outline-offset:1px}
button{font:inherit;font-weight:700;font-size:16px;padding:14px;border:0;border-radius:999px;background:var(--fg);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;min-height:1.2em;margin:0}
</style>
</head>
<body>
<div class="card">
  <div class="top"><small>Partner access</small><h1>Haps Club × Blackbird</h1></div>
  <form id="f" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autofocus required>
    <button id="go" type="submit">View proposal</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
async function show(pw,silent){
  try{const html=await unlock(pw);try{sessionStorage.setItem("hbb",pw)}catch(e){}
    document.open();document.write(html);document.close();}
  catch(e){if(!silent){document.getElementById("err").textContent="That password didn't work. Try again.";}
    document.getElementById("go").disabled=false;}
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();
  document.getElementById("go").disabled=true;document.getElementById("err").textContent="";
  show(document.getElementById("pw").value,false);});
try{const s=sessionStorage.getItem("hbb");if(s)show(s,true);}catch(e){}
